#!/bin/sh
# Alpine Linux Workstation Configuration: lab-pc01
# Generated by NetArchitect AI

# Set hostname
hostname lab-pc01
echo "lab-pc01" > /etc/hostname

# Configure Network Interface
cat << 'EOF' > /etc/network/interfaces
auto lo
iface lo inet loopback

auto eth0
iface eth0 inet static
    address 10.100.1.11
    netmask 255.255.255.0
    gateway 10.100.1.1
EOF

# Set DNS Resolvers
echo "nameserver 1.1.1.1" > /etc/resolv.conf
echo "nameserver 8.8.8.8" >> /etc/resolv.conf

# Restart networking
ifdown eth0 2>/dev/null || true
ifup eth0

echo "lab-pc01 network configuration initialized."

