#!/bin/sh
# Open vSwitch Layer 2/3 Configuration: ovs-lab-sw01
# Generated by NetArchitect AI

# Start OVS service if needed
/etc/init.d/openvswitch-switch start 2>/dev/null || true

# Initialize Bridge
ovs-vsctl --if-exists del-br br-lab
ovs-vsctl add-br br-lab

# Uplink Trunk to vyos-lab-gw (eth0 carries 802.1Q tagged traffic)
ovs-vsctl add-port br-lab eth0
ip link set eth0 up

# Inter-Switch Trunk to ovs-lab-sw02 (eth7 carries 802.1Q tagged traffic)
ovs-vsctl add-port br-lab eth7
ip link set eth7 up

# Access Ports for Lab Workstations (VLAN 100 Tagged at Ingress)
ovs-vsctl add-port br-lab eth1 tag=100
ip link set eth1 up

ovs-vsctl add-port br-lab eth2 tag=100
ip link set eth2 up

# Expansion Access Ports reserved for additional lab workstations
ovs-vsctl add-port br-lab eth3 tag=100
ip link set eth3 up
ovs-vsctl add-port br-lab eth4 tag=100
ip link set eth4 up
ovs-vsctl add-port br-lab eth5 tag=100
ip link set eth5 up
ovs-vsctl add-port br-lab eth6 tag=100
ip link set eth6 up

# Bring bridge up
ip link set br-lab up

# Management Interface
ovs-vsctl --if-exists del-br br-mgmt
ovs-vsctl add-br br-mgmt
ip addr add 192.168.122.11/24 dev br-mgmt 2>/dev/null || true
ip link set br-mgmt up

echo "ovs-lab-sw01 configuration successfully applied."
